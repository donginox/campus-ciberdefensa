<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Objetivo de práctica · Campus</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><p class="eyebrow">CAMPUS · OBJETIVO LOCAL</p><h1 id="title">Preparando práctica…</h1><p id="description"></p><p id="objective"></p><p id="source"></p><p id="identity"></p>
<section id="soc" hidden><h2>Solicitudes HTTP</h2><p>El actor es una etiqueta ficticia. El peer registrado corresponde al origen HTTP real.</p><label>Actor <select id="actor"><option>visitante</option><option>sonda</option><option>operador</option></select></label><label>Usuario <input id="username" value="analista" maxlength="100" autocomplete="off"></label><label>Contraseña de práctica <input id="password" value="campus-practica" maxlength="200" autocomplete="off"></label><button id="login">Enviar login</button><button id="catalog">Solicitar catálogo</button><button id="admin">Solicitar administración</button><button id="block">Bloquear actor en la práctica</button><label>Fallos observados <input id="failures" type="number" min="0" max="300" value="0"></label><button id="assess">Evaluar hipótesis</button></section>
<section id="database" hidden><h2>Consulta SQLite</h2><label for="query">SQL de lectura</label><textarea id="query" rows="7" maxlength="8192" spellcheck="false">SELECT * FROM auth_events LIMIT 20</textarea><button id="execute">Ejecutar consulta</button></section>
<p id="status" role="status" aria-live="polite"></p><pre id="result" tabindex="0" aria-label="Resultado de la solicitud"></pre><section><h2>Eventos de la sesión</h2><button id="refresh">Actualizar eventos</button><pre id="events" tabindex="0"></pre></section><p>Detener o reiniciar este servicio borra su sesión. Las notas del campus se conservan por separado.</p></main></body></html>
